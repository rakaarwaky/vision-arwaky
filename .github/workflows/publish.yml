name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Smoke-test built wheel in a clean environment
        run: |
          uv venv "$RUNNER_TEMP/vision-arwaky-smoke"
          uv pip install \
            --python "$RUNNER_TEMP/vision-arwaky-smoke/bin/python" \
            dist/*.whl
          "$RUNNER_TEMP/vision-arwaky-smoke/bin/vision-arwaky-cli" --help

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
