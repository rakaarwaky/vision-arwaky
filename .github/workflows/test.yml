name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  format:
    name: Format (ruff format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install project
        run: uv sync --no-dev

      - name: Install lint deps
        run: uv pip install ruff

      - name: Check formatting
        run: uv run ruff format --check modules/ tests/

  lint:
    name: Lint (ruff check + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install project
        run: uv sync --no-dev

      - name: Install lint deps
        run: uv pip install ruff mypy

      - name: Ruff check
        run: uv run ruff check modules/ tests/

      - name: Mypy check
        run: uv run mypy modules/

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install project
        run: uv sync --no-dev

      - name: Build
        run: uv build

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 tesseract-ocr ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --no-dev

      - name: Install additional deps (not in pyproject.toml)
        run: uv pip install opencv-contrib-python-headless pytesseract pytest

      - name: Generate test fixtures
        run: |
          uv run python3 -c "
          import cv2, numpy as np, os
          os.makedirs('tests/fixtures', exist_ok=True)
          img = np.zeros((200, 200, 3), dtype=np.uint8)
          cv2.rectangle(img, (30, 30), (170, 170), (255, 255, 255), -1)
          cv2.putText(img, 'TEST', (50, 120), cv2.FONT_HERSHEY_SIMPLEX, 1.5, (0, 255, 0), 3)
          cv2.imwrite('tests/fixtures/test.jpeg', img)
          out = cv2.VideoWriter('tests/fixtures/test.mp4',
                                cv2.VideoWriter_fourcc(*'mp4v'), 10, (100, 100))
          for i in range(10):
              frame = np.ones((100, 100, 3), dtype=np.uint8) * i * 25
              out.write(frame)
          out.release()
          "

      - name: Run tests
        run: uv run python3 -m pytest tests/ -v

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo rakaarwaky/vision-arwaky \
            --title "CI Auto-Fix: ${{ github.sha }}" \
            --label "auto-fix-ci" \
            --body "CI workflow failed on $(date -u).
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  self-lint:
    name: Self-Lint (lint-arwaky-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lint-arwaky-cli
        run: cargo install lint-arwaky --locked

      - name: Install Python deps for import scan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 tesseract-ocr ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install project
        run: uv sync --no-dev

      - name: Run self-lint (must be 0 violations)
        run: |
          output=$(lint-arwaky-cli scan . 2>&1) || { echo "$output"; exit 1; }
          echo "$output" | tail -5
          violations=$(echo "$output" | grep -oP 'Total:\s*\K\d+' || echo "0")
          echo "Violations: ${violations}"
          [ "${violations}" = "0" ]
