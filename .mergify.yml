# Mergify configuration for rakaarwaky/agents-arwaky
#
# Products used:
#   Merge Queue     — serializes merges on main so CI checks always run on
#                     the final cumulative state before merge.
#   Workflow Automation — auto-labels PRs so merge protections and queue
#                     rules can branch on label, keeping the human
#                     responsible for deciding *what* gets queued, Mergify
#                     responsible for *whether* it's safe to land.
#
# Validate before pushing:
#   mergify config validate
#   mergify config simulate https://github.com/rakaarwaky/agents-arwaky/pull/<N>

# ── Merge Queue ───────────────────────────────────────────────────────────────
# main is the only protected branch; the queue serializes merges through
# speculative check runs so CI failures surface before they reach main.

queue_rules:
  - name: default
    queue_conditions:
      - base=main
      - -draft
      - check-success=verify
    merge_conditions:
      - check-success=verify
      - "label~=(queue|ci|docs|refactor|chore)"
    merge_method: squash
    batch_size: 1
    checks_timeout: 45m

merge_queue:
  queued_label: queued
  dequeued_label: dequeued
  checking_label: queue-checking
  status_comments: outcomes

# ── Pull Request Rules (Workflow Automation) ─────────────────────────────────
# These rules auto-label PRs on open and update; merge_protections then
# gates the merge on the right labels + a green aa-check.

pull_request_rules:
  # Label by area so queue/merge protections can act on it.
  - name: label-manifest-or-env
    description: Tag PRs that touch the tool manifest or XDG config paths
    conditions:
      - 'file~=^(config/manifest.json|modules/shared/src/xdg/|modules/shared/src/envfile)'
    actions:
      label:
        add: [manifest]

  - name: label-agents-md
    description: Flag PRs that touch the agent operating manual
    conditions:
      - 'file~=^AGENTS\.md'
    actions:
      label:
        add: [docs]

  - name: label-skill-pack
    description: Tag PRs that add, remove, or reshape skills
    conditions:
      - "file~=^skills/"
    actions:
      label:
        add: [skills]

  - name: label-internal-agent
    description: Flag PRs that touch in-house agent submodules
    conditions:
      - "file~=^internal/"
    actions:
      label:
        add: [internal-agent]

  - name: label-vendor-pinning
    description: Flag PRs that update a vendor submodule pin
    conditions:
      - 'file~=^vendor/.*\.gitmodules$'
    actions:
      label:
        add: [vendor]

  # Auto-queue low-risk PRs once CI passes.
  - name: auto-queue-ci-and-docs
    description: Queue PRs labelled ci or docs when the verify check is green
    conditions:
      - "label~=(ci|docs)"
      - check-success=verify
      - -draft
      - base=main
    actions:
      queue:
        name: default

  # Merge only when CI is green. Mergify injects GitHub branch protections
  # automatically, so a required review set there gates this too.
  - name: merge-when-ci-green
    description: Squash-merge a ready PR to main once the verify check passes
    conditions:
      - base=main
      - -draft
      - check-success=verify
      - "label~=(queue|ci|docs|refactor|chore|manifest|skills|internal-agent|vendor)"
    actions:
      merge:
        method: squash
        merge_bot_account: rakaarwaky

# ── Merge Protections ─────────────────────────────────────────────────────────
# Auto-merge only when CI passes AND the PR carries an auto-merge label.

merge_protections:
  - name: auto-merge-gate
    description: Hold the merge until the verify check reports success
    if:
      - base=main
      - -draft
    success_conditions:
      - check-success=verify

merge_protections_settings:
  auto_merge_conditions:
    - "label~=(queue|ci|docs)"
    - check-success=verify
    - base=main

# ── Priority Rules ─────────────────────────────────────────────────────────────

priority_rules:
  - name: urgent-priority
    conditions:
      - label=urgent
    priority: high

  - name: default-priority
    conditions:
      - -label=urgent
    priority: medium
