[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-arwaky"
version = "2.0.7"
description = "MCP server for unified image and video processing"
requires-python = ">=3.12"
authors = [
    {name = "rakaarwaky", email = "arwaky90@gmail.com"}
]
dependencies = [
    "mcp[cli]",
    "fastmcp",
    "pydantic",
    "opencv-contrib-python-headless",
    "pillow",
    "numpy",
    "pytesseract",
    "requests",
    "pyyaml",
    "llama-cpp-python",
    "textual>=2.0.0",
]

[project.scripts]
vision-arwaky-mcp = "modules.root_mcp_entry:main"
vision-arwaky-cli = "modules.root_cli_entry:cli"
vision-arwaky-tui = "modules.root_tui_entry:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*"]
exclude = ["modules.*.tests*", "tests*"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["cv2", "mcp.*", "fastmcp.*", "llama_cpp.*", "pytesseract", "yaml", "requests", "PIL"]
ignore_missing_imports = true

# These third-party packages ship stubs that change signature between
# releases; do not let their churn block CI for our own code.
[[tool.mypy.overrides]]
module = ["cv2", "llama_cpp.*"]
ignore_errors = true
