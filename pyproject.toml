[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-arwaky"
version = "3.0.0"
description = "MCP server for unified image and video processing"
requires-python = ">=3.12"
authors = [
    {name = "rakaarwaky", email = "arwaky90@gmail.com"}
]
dependencies = [
    "mcp[cli]",
    "fastmcp",
    "pydantic",
    "opencv-contrib-python-headless",
    "pillow>=12.3.0",
    "numpy",
    "pytesseract",
    "requests",
    "pyyaml",
    "textual>=2.0.0",
]

[project.scripts]
vision-arwaky = "modules.root_cli_entry:cli"
va = "modules.root_cli_entry:cli"
vision-arwaky-cli = "modules.root_cli_entry:cli"
vision-arwaky-mcp = "modules.root_mcp_entry:main"
vision-arwaky-tui = "modules.root_tui_entry:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*"]
exclude = ["modules.*.tests*", "tests*"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["cv2", "mcp.*", "fastmcp.*", "pytesseract", "yaml", "requests", "PIL"]
ignore_missing_imports = true

# These third-party packages ship stubs that change signature between
# releases; do not let their churn block CI for our own code.
[[tool.mypy.overrides]]
module = ["cv2"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = [
    "modules/video/tests",
    "modules/image/tests",
    "modules/system/tests",
    "modules/cli/tests",
    "modules/mcp/tests",
    "modules/shared/tests",
]
pythonpath = ["."]
python_files = ["unit_*.py", "test_*.py"]
filterwarnings = [
    "ignore::pydantic_settings.IncompleteFieldDefinitionWarning",
]

[tool.pydocstyle]
ignore = ["D203"]
